name: Profile cards

on:
  schedule:
    - cron: "37 20 * * *"    # daily at 02:07 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - assets/**
      - fonts/**

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools pillow

      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
        run: python scripts/fetch_github_data.py

      - name: Render cards
        run: python scripts/render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json cards README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh profile cards"
            git push
          fi
